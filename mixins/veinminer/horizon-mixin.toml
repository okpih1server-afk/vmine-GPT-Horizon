[mod]
id = "veinminer"
version = "0.3.2"
priority = 100

[compatibility]
horizon_revision = "d91cab68ded29bd2b004f7050c468fb98c41a00b"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "veinminer"
source = "runtime.rs"

[[injection]]
id = "mining"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::Game<'_>::break_block"
helper = "mining.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32;3]", value = "pos" },
]

[[injection]]
id = "command"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::commands::Game<'_>::run_command"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
]

[[injection]]
id = "guest-command"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::lan_actions::Game<'_>::guest_command"
helper = "guest-command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "host", ty = "&mut crate::game::lan::LanHost", value = "&mut *host" },
  { name = "conn", ty = "u32", value = "conn" },
  { name = "command", ty = "&str", value = "command" },
]

[[injection]]
id = "mining-speed"
kind = "RETURN"
target = "horizon_client::game::Game<'_>::destroy_progress"
helper = "speed.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32;3]", value = "pos" },
  { name = "value", ty = "f32", value = "$value" },
]

[[injection]]
id = "delayed-mining-tick"
kind = "HEAD"
target = "horizon_client::game::Game<'_>::tick"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "merge-dropped-items"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::Game<'_>::spawn_item"
helper = "drop.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "&stack" },
  { name = "position", ty = "[f64;3]", value = "position" },
  { name = "velocity", ty = "[f64;3]", value = "velocity" },
  { name = "pickup_delay", ty = "u32", value = "pickup_delay" },
]
